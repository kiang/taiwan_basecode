version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: taiwan_postgis
    environment:
      POSTGRES_DB: taiwan_gis
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: gis_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./sql_init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_user -d taiwan_gis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data: